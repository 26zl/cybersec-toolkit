name: Update uv dependencies

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve and verify the upgraded lockfile with NO write-scoped token in scope:
  # this job installs and runs freshly-upgraded, unreviewed dependencies, so it must
  # not be able to push, open a PR, or leave a usable token behind. It hands the
  # verified uv.lock to the write-scoped job below as an artifact.
  lock-and-verify:
    name: Resolve and verify upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.upgrade.outputs.changed }}
      summary: ${{ steps.upgrade.outputs.summary }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # This job runs freshly upgraded packages; keep them out of the shared cache.
          enable-cache: false

      - name: Upgrade all packages in uv.lock
        id: upgrade
        run: |
          cd mcp_server
          cp uv.lock uv.lock.old
          # pyproject.toml sets [tool.uv] exclude-newer = "3 days" to avoid
          # locking package releases during their highest-risk window.
          uv lock --upgrade
          if diff -q uv.lock uv.lock.old > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates available."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Build a readable summary of what changed
            diff uv.lock.old uv.lock | grep '^[<>].*version' | head -30 > /tmp/diff_summary.txt || true
            {
              echo 'summary<<EOF'
              cat /tmp/diff_summary.txt
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi
          rm -f uv.lock.old

      - name: Verify upgraded lockfile (sync, import, lint, tests, audit, sync-check)
        if: steps.upgrade.outputs.changed == 'true'
        run: |
          cd mcp_server && uv sync --quiet
          uv run python -c "
          import sys; sys.path.insert(0, '..')
          from mcp_server.server import mcp, _db
          assert _db.total_tools > 600, f'Expected 600+ tools (registry sanity floor), got {_db.total_tools}'
          print(f'MCP server OK: {_db.total_tools} tools')
          "
          uv run --group dev ruff check .
          uv run --group dev ruff format --check .
          uv run --group dev python -m pytest tests/ -q
          # Ignore IDs in known-vulnerabilities.txt (mirrors security.yml).
          ignore_args=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs)"
            [[ -z "$line" ]] && continue
            ignore_args+=(--ignore-vuln "$line")
          done < known-vulnerabilities.txt
          # Audit the full locked set incl. ctf extras (mirrors security.yml).
          uv export --all-extras --no-hashes --frozen > /tmp/requirements.txt
          uvx pip-audit@2.10.1 -r /tmp/requirements.txt "${ignore_args[@]}"
          cd ..
          python3 scripts/validate_mcp_sync.py

      - name: Upload verified lockfile
        if: steps.upgrade.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-lock
          path: mcp_server/uv.lock
          retention-days: 1

  # Open the PR with the verified lockfile. This job holds the write-scoped token
  # but never runs any upgraded dependency: it only restores the artifact produced
  # above (no `uv lock`/`uv sync` here, which could build sdists and execute code).
  open-pr:
    name: Open dependency PR
    needs: lock-and-verify
    if: needs.lock-and-verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore verified lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uv-lock
          path: mcp_server

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump uv dependencies"
          branch: auto/uv-update
          delete-branch: true
          title: "chore: bump uv dependencies"
          add-paths: mcp_server/uv.lock
          body: |
            Automated weekly dependency update for `mcp_server/uv.lock`.

            ```
            ${{ needs.lock-and-verify.outputs.summary }}
            ```

            Verified against the upgraded lock in a separate token-less job: `uv sync`, MCP import check, `ruff check`/`format --check`, `pytest`, `pip-audit`, and `validate_mcp_sync.py` all passed before this PR was opened.
          labels: dependencies

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          gh pr merge --auto --squash "$PR_NUMBER" || true
          # If this fails with "Auto merge is not allowed", enable it under
          # repo Settings → General → Pull Requests → Allow auto-merge.
          # Branch protection's required approvals/checks still gate the actual merge.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
