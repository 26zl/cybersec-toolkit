name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "docs/**"
      - "writeups/**"
      - "assets/**"
      - ".github/**"
      - "*.md"
      - "glama.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  # Queue instead of cancelling: a build aborted mid-push leaves its tags half-updated.
  cancel-in-progress: false

jobs:
  publish:
    name: Build, scan, and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      # Sign build provenance and the SBOM with a short-lived OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # server.json points the MCP registry at the image tag that equals VERSION.
      - name: Check the release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$version" && "$tag" != "$version"-* ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION ${version}"
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Only default-branch builds move latest; the default flavor would also add it on v* tags.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            # Tag builds rebuild the same commit; a second sha- tag would point at a different image.
            type=sha,format=short,enable=${{ github.ref_type == 'branch' }}

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan for fixable HIGH/CRITICAL CVEs (gate before push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The MCP Registry launches the image with server.json's arguments; prove that exact
      # command answers an MCP initialize before anything is pushed.
      - name: Answer MCP initialize with the registry launch command
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          mapfile -t runtime_args < <(jq -r '.packages[0].runtimeArguments[] | .name, .value' server.json)
          mapfile -t package_args < <(jq -r '.packages[0].packageArguments[] | .value' server.json)
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 120 docker run --rm -i "${runtime_args[@]}" "$IMAGE" "${package_args[@]}" \
            | grep -q '"serverInfo"'

      # Logged in only for the push: the build and the scanner never see the credential.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild from the buildx cache and push (near-instant; layers are cached from
      # the scanned build). Emits the manifest digest the attestations bind to.
      - name: Push to GHCR
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # SBOM the locally-loaded image (no registry pull); attest it to the pushed digest.
      - name: Generate SBOM (SPDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scan-type: image
          format: spdx-json
          output: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
